fragment PageParts on Page {
  __typename
  title
  layout
  blocks {
    __typename
    ... on PageBlocksHomeHero {
      eyebrow
      heading
      subheading
      ctaPrimary
      ctaPrimaryLink
      ctaSecondary
      ctaSecondaryLink
      metaLine
      marqueeItems
    }
    ... on PageBlocksAboutHero {
      eyebrow
      heading
      leadText
      ctaPrimary
      ctaPrimaryLink
      ctaSecondary
      ctaSecondaryLink
      metaLine
      portraitImage
      portraitCaption
      deskImage
      deskCaption
      screenImage
      screenCaption
    }
    ... on PageBlocksHero {
      heading
      subheading
      backgroundImage
      ctaLabel
      ctaLink
    }
    ... on PageBlocksHeroSplitImage {
      eyebrow
      heading
      subheading
      featuredImage
      imageAlt
      imageCaption
      imagePosition
      ctaPrimary
      ctaPrimaryLink
      ctaSecondary
      ctaSecondaryLink
    }
    ... on PageBlocksHeroFullBleed {
      backgroundImage
      heading
      subheading
      overlay
      textAlign
      minHeight
      ctaLabel
      ctaLink
    }
    ... on PageBlocksHeroFloatingImages {
      eyebrow
      heading
      subheading
      images {
        __typename
        src
        alt
        caption
      }
      ctaPrimary
      ctaPrimaryLink
      ctaSecondary
      ctaSecondaryLink
    }
    ... on PageBlocksHeroImageGrid {
      eyebrow
      heading
      subheading
      layout
      images {
        __typename
        src
        alt
        caption
      }
      ctaLabel
      ctaLink
    }
    ... on PageBlocksPageHeader {
      heading
      description
    }
    ... on PageBlocksText {
      heading
      body
    }
    ... on PageBlocksStory {
      number
      label
      heading
      paragraph1
      quote
      paragraph2
      sideImage
      sideCaption
    }
    ... on PageBlocksTimeline {
      number
      label
      events {
        __typename
        year
        title
        description
        image
      }
    }
    ... on PageBlocksStatsRow {
      stats {
        __typename
        value
        label
      }
    }
    ... on PageBlocksFeatureGrid {
      heading
      items {
        __typename
        icon
        title
        description
      }
    }
    ... on PageBlocksCardRow {
      number
      label
      cards {
        __typename
        tag
        title
        body
        image
        ctaLabel
        link
      }
    }
    ... on PageBlocksPillars {
      eyebrow
      heading
      items {
        __typename
        tag
        title
        sub
        cta
        badge
        link
        image
      }
    }
    ... on PageBlocksImageGallery {
      heading
      images {
        __typename
        src
        alt
        caption
      }
    }
    ... on PageBlocksImageSpotlight {
      eyebrow
      heading
      image
      alt
      caption
      aspect
      body
    }
    ... on PageBlocksImageSideBySide {
      heading
      leftImage {
        __typename
        src
        alt
        caption
      }
      rightImage {
        __typename
        src
        alt
        caption
      }
      style
    }
    ... on PageBlocksImageMasonry {
      heading
      images {
        __typename
        src
        alt
        caption
        size
      }
    }
    ... on PageBlocksVideoEmbed {
      heading
      youtubeUrl
    }
    ... on PageBlocksFeaturedBook {
      eyebrow
      heading
      description
      stats {
        __typename
        value
        label
      }
      ctaLabel
      ctaLink
      secondaryLabel
      secondaryLink
    }
    ... on PageBlocksFeaturedRelease {
      eyebrow
      title
      description
      coverImage
      backCoverImage
      ctaLabel
      ctaHref
    }
    ... on PageBlocksProductStrip {
      eyebrow
      heading
      viewAllLabel
      viewAllLink
    }
    ... on PageBlocksShopCatalog {
      heading
      highlightText
      description
      showFeaturedBanner
      emptyHeading
      emptyDescription
    }
    ... on PageBlocksGalleryGrid {
      emptyHeading
      emptyDescription
    }
    ... on PageBlocksDownloadsGrid {
      emptyHeading
      emptyDescription
    }
    ... on PageBlocksTutorialsStrip {
      eyebrow
      headingPrefix
      headingHighlight
      headingSuffix
      buttonLabel
      youtubeUrl
      stats {
        __typename
        value
        label
      }
    }
    ... on PageBlocksClassesPitch {
      eyebrow
      heading
      subheading
      bullets
      metaTags
      ctaLabel
      ctaLink
      secondaryLabel
      secondaryLink
    }
    ... on PageBlocksBlogFeed {
      heading
      showNewsletter
      newsletter {
        __typename
        eyebrow
        heading
        subheading
        placeholderText
        ctaLabel
        privacyNote
      }
    }
    ... on PageBlocksCtaBand {
      heading
      description
      ctaLabel
      ctaLink
      variant
    }
    ... on PageBlocksBigCta {
      eyebrow
      heading
      highlightText
      primaryLabel
      primaryLink
      secondaryLabel
      secondaryLink
    }
    ... on PageBlocksNewsletterSignup {
      eyebrow
      heading
      subheading
      placeholderText
      ctaLabel
      privacyNote
    }
    ... on PageBlocksContactInfo {
      email
      location
    }
    ... on PageBlocksContactForm {
      submitLabel
    }
    ... on PageBlocksDummyBookRequest {
      heading
      description
      pdfUrl
      submitLabel
      successHeading
      successNote
      downloadLabel
    }
    ... on PageBlocksKofiSupport {
      heading
      body
      ctaLabel
      href
    }
    ... on PageBlocksReviewLinks {
      heading
      intro
      thankYou
      ctaHeading
      links {
        __typename
        label
        href
        region
      }
    }
    ... on PageBlocksMarquee {
      highlightText
      text
    }
    ... on PageBlocksSocialLinks {
      heading
      body
      links {
        __typename
        platform
        url
        label
      }
    }
  }
}

