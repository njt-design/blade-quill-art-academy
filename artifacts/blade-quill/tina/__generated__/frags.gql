fragment HomeParts on Home {
  __typename
  hero {
    __typename
    heading
    subheading
    ctaPrimary
    ctaSecondary
    backgroundImage
  }
  latestSection {
    __typename
    heading
    viewAllLabel
  }
  featuredSection {
    __typename
    heading
    subheading
    viewAllLabel
  }
  artistBanner {
    __typename
    badge
    heading
    bio
    ctaLabel
    portraitImage
  }
  tutorialsSection {
    __typename
    heading
    subheading
    browseAllLabel
  }
  bookPromo {
    __typename
    heading
    description
    ctaLabel
    ctaLink
  }
}

fragment AboutParts on About {
  __typename
  pageTitle
  portraitImage
  leadText
  paragraph1
  paragraph2
  skill1Label
  skill2Label
  skill3Label
  ctaPrimary
  ctaPrimaryLink
  ctaSecondary
  ctaSecondaryLink
}

fragment ContactParts on Contact {
  __typename
  pageTitle
  pageDescription
  email
  location
}

fragment ShopParts on Shop {
  __typename
  pageTitle
  pageDescription
  emptyHeading
  emptyDescription
}

fragment GalleryParts on Gallery {
  __typename
  pageTitle
  pageDescription
  emptyHeading
  emptyDescription
}

fragment TutorialsParts on Tutorials {
  __typename
  pageTitle
  pageDescription
  subscribeLabel
  youtubeUrl
  emptyHeading
  emptyDescription
}

fragment DownloadsParts on Downloads {
  __typename
  pageTitle
  pageDescription
  emptyHeading
  emptyDescription
}

fragment PostParts on Post {
  __typename
  title
  excerpt
  coverImage
  publishedAt
  tags
  body
}

fragment LandingPageParts on LandingPage {
  __typename
  title
  blocks {
    __typename
    ... on LandingPageBlocksHero {
      heading
      subheading
      backgroundImage
      ctaLabel
      ctaLink
    }
    ... on LandingPageBlocksText {
      heading
      body
    }
    ... on LandingPageBlocksImageGallery {
      heading
      images {
        __typename
        src
        alt
        caption
      }
    }
    ... on LandingPageBlocksCtaBand {
      heading
      description
      ctaLabel
      ctaLink
      variant
    }
    ... on LandingPageBlocksVideoEmbed {
      heading
      youtubeUrl
    }
    ... on LandingPageBlocksFeatureGrid {
      heading
      items {
        __typename
        icon
        title
        description
      }
    }
  }
}
